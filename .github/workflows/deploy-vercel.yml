# Deploys the site (icopedia.co, including /admin and api/) to Vercel on
# every push to main.
#
# The Vercel project lives on a different account from this GitHub repo, so
# Vercel's own Git integration can't see pushes. This workflow deploys with
# a Vercel token instead, the same way `vercel --prod` does from a laptop.
#
# Needs three repository secrets (Settings -> Secrets and variables ->
# Actions):
#   VERCEL_TOKEN       Vercel account settings -> Tokens -> Create
#   VERCEL_ORG_ID      Vercel account (or team) settings -> General -> ID
#   VERCEL_PROJECT_ID  Vercel project -> Settings -> General -> Project ID
# Environment variables (VITE_*, mail keys) come from the Vercel project
# itself via `vercel pull`, so nothing else is stored here.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a deploy still running for an older one.
concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see the top of this file)."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull project settings and production env vars
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
